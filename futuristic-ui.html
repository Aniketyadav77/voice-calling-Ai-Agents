<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice AI Agent - Futuristic Interface</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated background particles */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            animation: float 15s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) translateX(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) translateX(100px);
                opacity: 0;
            }
        }

        /* Glassmorphism container */
        .glass-container {
            position: relative;
            z-index: 1;
            max-width: 900px;
            margin: 50px auto;
            padding: 40px;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            padding: 40px;
            margin: 20px 0;
            animation: fadeInUp 0.8s ease-out;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Header */
        h1 {
            color: #fff;
            font-size: 3em;
            text-align: center;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
            animation: glow 2s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% {
                text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
            }
            50% {
                text-shadow: 0 0 30px rgba(255, 255, 255, 0.8);
            }
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.9);
            text-align: center;
            font-size: 1.2em;
            margin-bottom: 30px;
        }

        /* Microphone visualizer */
        .mic-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 40px 0;
            position: relative;
        }

        .mic-button {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            cursor: pointer;
            position: relative;
            transition: all 0.3s ease;
            box-shadow: 0 10px 40px rgba(102, 126, 234, 0.4);
        }

        .mic-button:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 50px rgba(102, 126, 234, 0.6);
        }

        .mic-button.active {
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(102, 126, 234, 0.7);
            }
            50% {
                box-shadow: 0 0 0 30px rgba(102, 126, 234, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(102, 126, 234, 0);
            }
        }

        .mic-icon {
            font-size: 60px;
            color: #fff;
        }

        .wave-rings {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .wave-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 150px;
            height: 150px;
            margin: -75px 0 0 -75px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            opacity: 0;
        }

        .mic-button.active .wave-ring {
            animation: wave 2s infinite;
        }

        .wave-ring:nth-child(2) {
            animation-delay: 0.5s;
        }

        .wave-ring:nth-child(3) {
            animation-delay: 1s;
        }

        @keyframes wave {
            0% {
                transform: scale(1);
                opacity: 0.5;
            }
            100% {
                transform: scale(2.5);
                opacity: 0;
            }
        }

        /* Status display */
        .status-display {
            text-align: center;
            margin: 30px 0;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .status-text {
            color: #fff;
            font-size: 1.1em;
            margin: 10px 0;
        }

        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
            animation: blink 1s infinite;
        }

        .status-indicator.connected {
            background: #4ade80;
        }

        .status-indicator.recording {
            background: #f43f5e;
        }

        .status-indicator.idle {
            background: #94a3b8;
        }

        @keyframes blink {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.3;
            }
        }

        /* Transcription display */
        .transcription-display {
            min-height: 150px;
            padding: 30px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin: 30px 0;
            position: relative;
            overflow: hidden;
        }

        .transcription-text {
            color: #fff;
            font-size: 1.5em;
            line-height: 1.6;
            text-align: center;
            animation: textGlow 3s ease-in-out infinite;
        }

        @keyframes textGlow {
            0%, 100% {
                text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
            }
            50% {
                text-shadow: 0 0 20px rgba(255, 255, 255, 0.6);
            }
        }

        .transcription-placeholder {
            color: rgba(255, 255, 255, 0.4);
            font-style: italic;
        }

        /* Control buttons */
        .controls {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            margin: 30px 0;
        }

        .btn {
            padding: 15px 40px;
            border: none;
            border-radius: 50px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* Audio visualizer */
        .audio-visualizer {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 4px;
            height: 60px;
            margin: 20px 0;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .audio-visualizer.active {
            opacity: 1;
        }

        .visualizer-bar {
            width: 6px;
            background: linear-gradient(to top, #667eea, #764ba2);
            border-radius: 3px;
            animation: visualize 0.8s ease-in-out infinite;
        }

        .visualizer-bar:nth-child(2) { animation-delay: 0.1s; }
        .visualizer-bar:nth-child(3) { animation-delay: 0.2s; }
        .visualizer-bar:nth-child(4) { animation-delay: 0.3s; }
        .visualizer-bar:nth-child(5) { animation-delay: 0.4s; }
        .visualizer-bar:nth-child(6) { animation-delay: 0.3s; }
        .visualizer-bar:nth-child(7) { animation-delay: 0.2s; }
        .visualizer-bar:nth-child(8) { animation-delay: 0.1s; }

        @keyframes visualize {
            0%, 100% {
                height: 10px;
            }
            50% {
                height: 50px;
            }
        }

        /* Info cards */
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }

        .info-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            transition: all 0.3s ease;
        }

        .info-card:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-5px);
        }

        .info-icon {
            font-size: 2em;
            margin-bottom: 10px;
        }

        .info-title {
            color: #fff;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .info-value {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9em;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .glass-card {
                padding: 20px;
            }

            h1 {
                font-size: 2em;
            }

            .mic-button {
                width: 120px;
                height: 120px;
            }

            .mic-icon {
                font-size: 50px;
            }
        }
    </style>
</head>
<body>
    <!-- Animated background particles -->
    <div class="particles" id="particles"></div>

    <!-- Main container -->
    <div class="glass-container">
        <!-- Header -->
        <div class="glass-card">
            <h1>🎙️ Voice AI Agent</h1>
            <p class="subtitle">Real-time Speech Recognition Powered by AI</p>
        </div>

        <!-- Main interface -->
        <div class="glass-card">
            <!-- Status display -->
            <div class="status-display">
                <div class="status-text">
                    <span class="status-indicator idle" id="statusIndicator"></span>
                    <span id="statusText">Ready to listen</span>
                </div>
            </div>

            <!-- Microphone button -->
            <div class="mic-container">
                <button class="mic-button" id="micButton">
                    <div class="mic-icon">🎤</div>
                    <div class="wave-rings">
                        <div class="wave-ring"></div>
                        <div class="wave-ring"></div>
                        <div class="wave-ring"></div>
                    </div>
                </button>
            </div>

            <!-- Audio visualizer -->
            <div class="audio-visualizer" id="audioVisualizer">
                <div class="visualizer-bar"></div>
                <div class="visualizer-bar"></div>
                <div class="visualizer-bar"></div>
                <div class="visualizer-bar"></div>
                <div class="visualizer-bar"></div>
                <div class="visualizer-bar"></div>
                <div class="visualizer-bar"></div>
                <div class="visualizer-bar"></div>
            </div>

            <!-- Transcription display -->
            <div class="transcription-display">
                <div class="transcription-text" id="transcriptionText">
                    <span class="transcription-placeholder">Your voice will appear here...</span>
                </div>
            </div>

            <!-- Controls -->
            <div class="controls">
                <button class="btn btn-primary" id="startBtn">Start Recording</button>
                <button class="btn" id="stopBtn" disabled>Stop Recording</button>
                <button class="btn" id="clearBtn">Clear Text</button>
            </div>
        </div>

        <!-- Info cards -->
        <div class="glass-card">
            <div class="info-grid">
                <div class="info-card">
                    <div class="info-icon">🎯</div>
                    <div class="info-title">Accuracy</div>
                    <div class="info-value" id="accuracy">High Precision</div>
                </div>
                <div class="info-card">
                    <div class="info-icon">⚡</div>
                    <div class="info-title">Speed</div>
                    <div class="info-value" id="speed">Real-time</div>
                </div>
                <div class="info-card">
                    <div class="info-icon">🌐</div>
                    <div class="info-title">Language</div>
                    <div class="info-value" id="language">English (US)</div>
                </div>
                <div class="info-card">
                    <div class="info-icon">⏱️</div>
                    <div class="info-title">Duration</div>
                    <div class="info-value" id="duration">0:00</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Create animated particles
        const particlesContainer = document.getElementById('particles');
        for (let i = 0; i < 30; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.width = Math.random() * 5 + 2 + 'px';
            particle.style.height = particle.style.width;
            particle.style.left = Math.random() * 100 + '%';
            particle.style.animationDelay = Math.random() * 15 + 's';
            particle.style.animationDuration = (Math.random() * 10 + 10) + 's';
            particlesContainer.appendChild(particle);
        }

        // Voice AI functionality
        let webSocket;
        let mediaRecorder;
        let audioStream;
        let isRecording = false;
        let startTime;
        let durationInterval;
        let recognition;

        const micButton = document.getElementById('micButton');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const clearBtn = document.getElementById('clearBtn');
        const statusIndicator = document.getElementById('statusIndicator');
        const statusText = document.getElementById('statusText');
        const transcriptionText = document.getElementById('transcriptionText');
        const audioVisualizer = document.getElementById('audioVisualizer');
        const durationDisplay = document.getElementById('duration');

        function updateStatus(status, text) {
            statusIndicator.className = 'status-indicator ' + status;
            statusText.textContent = text;
        }

        function updateTranscription(text) {
            transcriptionText.innerHTML = text;
            transcriptionText.classList.remove('transcription-placeholder');
        }

        function startDurationCounter() {
            startTime = Date.now();
            durationInterval = setInterval(() => {
                const elapsed = Math.floor((Date.now() - startTime) / 1000);
                const minutes = Math.floor(elapsed / 60);
                const seconds = elapsed % 60;
                durationDisplay.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;
            }, 1000);
        }

        function stopDurationCounter() {
            if (durationInterval) {
                clearInterval(durationInterval);
            }
        }

        // Initialize WebSocket connection
        function initWebSocket() {
            return new Promise((resolve, reject) => {
                webSocket = new WebSocket("ws://localhost:8080");
                
                webSocket.onopen = function() {
                    updateStatus('connected', 'Connected to server');
                    resolve();
                };
                
                webSocket.onmessage = function(event) {
                    const data = JSON.parse(event.data);
                    if (data.event === "interim-transcription") {
                        updateTranscription(data.text);
                    }
                };
                
                webSocket.onerror = function(error) {
                    updateStatus('idle', 'Connection error');
                    reject(error);
                };
                
                webSocket.onclose = function() {
                    updateStatus('idle', 'Connection closed');
                };
            });
        }

        // Start recording function
        async function startRecording() {
            try {
                updateStatus('connecting', 'Connecting...');
                
                // Initialize WebSocket
                if (!webSocket || webSocket.readyState !== WebSocket.OPEN) {
                    await initWebSocket();
                }
                
                // Get microphone access
                audioStream = await navigator.mediaDevices.getUserMedia({ 
                    audio: {
                        sampleRate: 16000,
                        channelCount: 1,
                        echoCancellation: true,
                        noiseSuppression: true
                    } 
                });
                
                mediaRecorder = new MediaRecorder(audioStream);
                
                mediaRecorder.ondataavailable = function(event) {
                    if (event.data.size > 0 && webSocket && webSocket.readyState === WebSocket.OPEN) {
                        const reader = new FileReader();
                        reader.onload = function() {
                            const arrayBuffer = reader.result;
                            const base64 = btoa(String.fromCharCode(...new Uint8Array(arrayBuffer)));
                            
                            webSocket.send(JSON.stringify({
                                event: "media",
                                media: { payload: base64 }
                            }));
                        };
                        reader.readAsArrayBuffer(event.data);
                    }
                };
                
                // Send start event
                webSocket.send(JSON.stringify({
                    event: "start",
                    streamSid: "browser-futuristic-ui"
                }));
                
                // Start recording
                mediaRecorder.start(250);
                isRecording = true;
                
                // Update UI
                micButton.classList.add('active');
                audioVisualizer.classList.add('active');
                startBtn.disabled = true;
                stopBtn.disabled = false;
                updateStatus('recording', 'Recording... Speak now!');
                startDurationCounter();
                
            } catch (error) {
                updateStatus('idle', 'Error: ' + error.message);
                console.error("Error:", error);
            }
        }

        // Stop recording function
        function stopRecording() {
            if (mediaRecorder && isRecording) {
                mediaRecorder.stop();
                isRecording = false;
            }
            
            if (audioStream) {
                audioStream.getTracks().forEach(track => track.stop());
            }
            
            if (webSocket && webSocket.readyState === WebSocket.OPEN) {
                webSocket.send(JSON.stringify({
                    event: "stop"
                }));
            }
            
            // Update UI
            micButton.classList.remove('active');
            audioVisualizer.classList.remove('active');
            startBtn.disabled = false;
            stopBtn.disabled = true;
            updateStatus('idle', 'Recording stopped');
            stopDurationCounter();
        }

        // Clear transcription
        function clearTranscription() {
            transcriptionText.innerHTML = '<span class="transcription-placeholder">Your voice will appear here...</span>';
            durationDisplay.textContent = '0:00';
        }

        // Event listeners
        micButton.addEventListener('click', () => {
            if (!isRecording) {
                startRecording();
            } else {
                stopRecording();
            }
        });

        startBtn.addEventListener('click', startRecording);
        stopBtn.addEventListener('click', stopRecording);
        clearBtn.addEventListener('click', clearTranscription);

        // Initialize
        updateStatus('idle', 'Ready to listen');
    </script>
</body>
</html>
