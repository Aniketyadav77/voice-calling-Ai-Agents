<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice AI Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
            background:
                radial-gradient(1200px 600px at 10% 10%, rgba(255,255,255,0.06), transparent),
                radial-gradient(900px 500px at 90% 80%, rgba(255,255,255,0.04), transparent),
                linear-gradient(180deg, #0b0f17 0%, #0a0d14 100%);
            color: #E6EAF2;
            height: 100vh;
            overflow: hidden;
            -webkit-font-smoothing:antialiased;
            -moz-osx-font-smoothing:grayscale;
        }

        /* Animated gradient background */
        .gradient-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(800px 400px at 20% 30%, rgba(102,126,234,0.15), transparent),
                        radial-gradient(900px 450px at 80% 70%, rgba(118,75,162,0.14), transparent);
            opacity: 0.35;
            z-index: 0;
        }

        .gradient-bg::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 50%, rgba(120, 119, 198, 0.25), transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(255, 103, 103, 0.22), transparent 50%),
                        radial-gradient(circle at 40% 20%, rgba(58, 123, 213, 0.22), transparent 50%);
            animation: gradientShift 15s ease infinite;
        }

        @keyframes gradientShift {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.1); }
        }

        /* Main container */
        .container {
            position: relative;
            z-index: 1;
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 28px;
            align-items: stretch;
            height: calc(100vh - 40px);
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
        }

        /* Header */
        .header {
            grid-column: 1 / -1;
            padding: 18px 22px;
            background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.03));
            border: 1px solid rgba(255,255,255,0.12);
            backdrop-filter: blur(16px) saturate(120%);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35), inset 0 0 0 1px rgba(255,255,255,0.04);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, rgba(255,255,255,0.22) 0%, rgba(255,255,255,0.10) 100%);
            border: 1px solid rgba(255,255,255,0.18);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.35), inset 0 1px rgba(255,255,255,0.35);
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .logo-text {
            font-size: 20px;
            font-weight: 600;
            background: linear-gradient(135deg, #dbe8ff 0%, #c9d0ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-status {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 14px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.14);
            border-radius: 999px;
            font-size: 13px;
            color: #d6e6ff;
            backdrop-filter: blur(10px);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4ade80;
            animation: blink 2s ease-in-out infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* Left panel (sidebar) and right chat */
        .sidebar {
            background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.03));
            border-radius: 16px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            min-width: 280px;
            max-height: calc(100vh - 120px);
            overflow: auto;
            border: 1px solid rgba(255,255,255,0.12);
            backdrop-filter: blur(14px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.35), inset 0 1px rgba(255,255,255,0.04);
        }

        .chat-wrapper {
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-height: 0;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 26px;
            scroll-behavior: smooth;
            background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.10);
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.35), inset 0 1px rgba(255,255,255,0.04);
        }

        .chat-container::-webkit-scrollbar {
            width: 8px;
        }

        .chat-container::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }

        .chat-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }

        /* Welcome screen */
        .welcome-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            animation: fadeIn 1s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .welcome-icon {
            font-size: 80px;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .welcome-title {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .welcome-subtitle {
            font-size: 18px;
            color: #a0a0a0;
            margin-bottom: 40px;
        }

        .suggestions {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-top: 22px;
            width: 100%;
        }

        .suggestion-card {
            padding: 14px;
            background: linear-gradient(180deg, rgba(255,255,255,0.10), rgba(255,255,255,0.04));
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            cursor: pointer;
            transition: transform 0.18s ease, box-shadow 0.18s ease;
            display: flex;
            align-items: center;
            gap: 12px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 22px rgba(0,0,0,0.35), inset 0 1px rgba(255,255,255,0.05);
        }

        .suggestion-card:hover {
            background: rgba(255, 255, 255, 0.14);
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.25);
        }

        .suggestion-icon {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .suggestion-text {
            font-size: 14px;
            color: #c0c0c0;
        }

        /* Message bubbles */
        .message {
            display: flex;
            gap: 14px;
            margin-bottom: 18px;
            animation: slideIn 0.28s ease-out;
            align-items: flex-start;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .user-avatar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .ai-avatar {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .message-content {
            flex: 1;
            max-width: 70%;
        }

        .message-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .message-name {
            font-weight: 600;
            font-size: 14px;
        }

        .message-time {
            font-size: 12px;
            color: #808080;
        }

        .message-text {
            background: linear-gradient(180deg, rgba(255,255,255,0.10), rgba(255,255,255,0.04));
            padding: 12px 16px;
            border-radius: 14px;
            line-height: 1.5;
            font-size: 15px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 8px 20px rgba(0,0,0,0.35), inset 0 1px rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            word-break: break-word;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.user .message-text {
            background: linear-gradient(135deg, rgba(255,255,255,0.22) 0%, rgba(255,255,255,0.10) 100%);
            border-color: rgba(255, 255, 255, 0.28);
            color: #0b0f17;
        }

        .message.ai .message-text { background: rgba(255, 255, 255, 0.06); }

        .typing-indicator {
            display: inline-flex;
            gap: 4px;
            padding: 15px 20px;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #808080;
            animation: typing 1.4s infinite;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-10px); }
        }

        /* Input area */
        .input-area {
            grid-column: 1 / -1;
            padding: 14px 18px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .input-container {
            display: flex;
            align-items: center;
            gap: 12px;
            background: linear-gradient(180deg, rgba(255,255,255,0.10), rgba(255,255,255,0.04));
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 999px;
            padding: 10px 14px;
            min-width: 420px;
            max-width: calc(100% - 60px);
            transition: box-shadow 0.15s ease;
            box-shadow: 0 8px 24px rgba(0,0,0,0.35), inset 0 1px rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
        }

        .input-container:focus-within {
            border-color: rgba(255, 255, 255, 0.25);
            box-shadow: 0 12px 34px rgba(0,0,0,0.45), 0 0 0 4px rgba(255,255,255,0.06);
            background: rgba(255, 255, 255, 0.14);
        }

        .input-field {
            flex: 1;
            background: transparent;
            border: none;
            color: #cfe8ff;
            font-size: 15px;
            outline: none;
        }

        .input-field::placeholder {
            color: #606060;
        }

        .input-actions {
            display: flex;
            gap: 10px;
        }

        .action-btn {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(180deg, rgba(255,255,255,0.14), rgba(255,255,255,0.06));
            border: 1px solid rgba(255,255,255,0.18);
            color: #f8fbff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            transition: transform 0.14s ease, box-shadow 0.14s ease, background 0.14s ease;
            box-shadow: 0 8px 18px rgba(0,0,0,0.35), inset 0 1px rgba(255,255,255,0.12);
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.22);
            transform: scale(1.05);
        }

        .action-btn.recording {
            background: linear-gradient(135deg, #ff7ab6 0%, #ff6a6a 100%);
            box-shadow: 0 12px 28px rgba(255,106,106,0.12);
            transform: scale(1.03);
        }

        @keyframes pulse-btn {
            0%, 100% { box-shadow: 0 0 0 0 rgba(245, 87, 108, 0.7); }
            50% { box-shadow: 0 0 0 15px rgba(245, 87, 108, 0); }
        }

        .send-btn { background: linear-gradient(135deg, rgba(255,255,255,0.20) 0%, rgba(255,255,255,0.08) 100%); }

        .send-btn:hover {
            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Voice wave animation */
        .voice-wave {
            display: none;
            position: fixed;
            bottom: 120px;
            right: 36px;
            background: linear-gradient(180deg, rgba(255,255,255,0.10), rgba(255,255,255,0.04));
            backdrop-filter: blur(14px);
            padding: 16px 18px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            z-index: 1000;
            box-shadow: 0 12px 40px rgba(0,0,0,0.5), inset 0 1px rgba(255,255,255,0.06);
        }

        .voice-wave.active {
            display: flex;
            align-items: center;
            gap: 8px;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        .wave-bar {
            width: 4px;
            background: linear-gradient(to top, #667eea, #764ba2);
            border-radius: 2px;
            animation: wave 0.8s ease-in-out infinite;
        }

        .wave-bar:nth-child(1) { animation-delay: 0s; }
        .wave-bar:nth-child(2) { animation-delay: 0.1s; }
        .wave-bar:nth-child(3) { animation-delay: 0.2s; }
        .wave-bar:nth-child(4) { animation-delay: 0.3s; }
        .wave-bar:nth-child(5) { animation-delay: 0.4s; }
        .wave-bar:nth-child(6) { animation-delay: 0.3s; }
        .wave-bar:nth-child(7) { animation-delay: 0.2s; }
        .wave-bar:nth-child(8) { animation-delay: 0.1s; }

        @keyframes wave {
            0%, 100% { height: 20px; }
            50% { height: 60px; }
        }

        /* Responsive */
        @media (max-width: 980px) {
            .container { grid-template-columns: 1fr; padding: 14px; height: calc(100vh - 28px); }
            .sidebar { order: 2; max-height: 180px; display: flex; flex-direction: row; gap: 12px; overflow-x: auto; }
            .chat-wrapper { order: 1; }
            .input-container { min-width: 0; width: 100%; }
        }

        @media (max-width: 520px) {
            .logo-text { display: none; }
            .message-content { max-width: 100%; }
            .suggestion-text { font-size: 13px; }
            .input-container { padding: 8px 10px; }
        }
    </style>
</head>
<body>
    <div class="gradient-bg"></div>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="logo">
                <div class="logo-icon" aria-hidden>🤖</div>
                <div class="logo-text">Voice AI Assistant</div>
            </div>
            <div class="header-status" role="status" aria-live="polite">
                <div class="status-dot" id="statusDot" aria-hidden></div>
                <span id="connectionStatus">Connected</span>
            </div>
        </div>

        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div style="font-weight:700; font-size:14px; color:#ddebff;">Quick Actions</div>
            <div class="suggestions" id="suggestions">
                <div class="suggestion-card" onclick="useSuggestion('Tell me about yourself')">
                    <div class="suggestion-icon">💡</div>
                    <div class="suggestion-text">Tell me about yourself</div>
                </div>
                <div class="suggestion-card" onclick="useSuggestion('What can you do?')">
                    <div class="suggestion-icon">🎯</div>
                    <div class="suggestion-text">What can you do?</div>
                </div>
                <div class="suggestion-card" onclick="useSuggestion('Help me with something')">
                    <div class="suggestion-icon">🚀</div>
                    <div class="suggestion-text">Help me with something</div>
                </div>
                <div class="suggestion-card" onclick="useSuggestion('Start voice conversation')">
                    <div class="suggestion-icon">🎤</div>
                    <div class="suggestion-text">Start voice conversation</div>
                </div>
            </div>
        </aside>

        <!-- Chat area -->
        <div class="chat-wrapper">
            <div class="chat-container" id="chatContainer">
                <!-- Welcome Screen inside chat -->
                <div class="welcome-screen" id="welcomeScreen">
                    <div class="welcome-icon" aria-hidden>👋</div>
                    <h1 class="welcome-title">Hello! How can I help you today?</h1>
                    <p class="welcome-subtitle">Ask me anything or use voice to speak with me</p>
                </div>
            </div>

            <!-- Floating Mic (mobile friendly) -->
            <div class="voice-wave" id="voiceWave" aria-hidden>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
                <div class="wave-bar"></div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="input-area">
            <div class="input-container" role="group" aria-label="Message input and actions">
                <input aria-label="Message input" type="text" class="input-field" id="messageInput" placeholder="Type your message or press the mic to speak" />
                <div class="input-actions">
                    <button class="action-btn" id="voiceBtn" title="Voice input" aria-pressed="false" aria-label="Toggle voice input">
                        🎤
                    </button>
                    <button class="action-btn send-btn" id="sendBtn" title="Send message" aria-label="Send message">
                        ➤
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
    // State management
    let webSocket;
    let mediaRecorder;
    let audioStream;
    let isRecording = false;
    let messages = [];
    let interimBubble = null;

        // DOM elements
        const chatContainer = document.getElementById('chatContainer');
        const welcomeScreen = document.getElementById('welcomeScreen');
        const messageInput = document.getElementById('messageInput');
        const voiceBtn = document.getElementById('voiceBtn');
        const sendBtn = document.getElementById('sendBtn');
        const voiceWave = document.getElementById('voiceWave');
        const connectionStatus = document.getElementById('connectionStatus');

        // Initialize WebSocket
        function initWebSocket() {
            return new Promise((resolve, reject) => {
                if (webSocket && webSocket.readyState === WebSocket.OPEN) return resolve();

                webSocket = new WebSocket(location.origin.replace(/^http/, 'ws'));

                webSocket.onopen = function() {
                    connectionStatus.textContent = 'Connected';
                    connectionStatus.style.color = '#4ade80';
                    document.getElementById('statusDot').style.background = '#4ade80';
                    resolve();
                };

                webSocket.onmessage = function(event) {
                    try {
                        const data = JSON.parse(event.data);
                        // Support different event shapes
                        if (data.event === "interim-transcription") {
                            showInterim(data.text);
                        } else if (data.event === 'transcript' || data.event === 'final-transcript') {
                            finalizeInterim(data.text || data.results || data.alternatives?.[0]?.transcript);
                        }
                    } catch (e) {
                        console.warn('Non-JSON WS message', e);
                    }
                };

                webSocket.onerror = function(error) {
                    connectionStatus.textContent = 'Error';
                    connectionStatus.style.color = '#f87171';
                    document.getElementById('statusDot').style.background = '#f87171';
                    reject(error);
                };

                webSocket.onclose = function() {
                    connectionStatus.textContent = 'Disconnected';
                    connectionStatus.style.color = '#fbbf24';
                    document.getElementById('statusDot').style.background = '#fbbf24';
                };
            });
        }

        // Add message to chat
        function addMessage(text, isUser = true) {
            welcomeScreen.style.display = 'none';

            const time = new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });

            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user' : 'ai'}`;
            messageDiv.innerHTML = `
                <div class="message-avatar ${isUser ? 'user-avatar' : 'ai-avatar'}" aria-hidden>
                    ${isUser ? '👤' : '🤖'}
                </div>
                <div class="message-content">
                    <div class="message-header">
                        <span class="message-name">${isUser ? 'You' : 'AI Assistant'}</span>
                        <span class="message-time">${time}</span>
                    </div>
                    <div class="message-text">${escapeHtml(text)}</div>
                </div>
            `;

            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            messages.push({ text, isUser, time });
            return messageDiv;
        }

        function escapeHtml(unsafe) {
            return String(unsafe)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        // Show typing indicator
        function showTypingIndicator() {
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message ai';
            typingDiv.id = 'typing-indicator';
            typingDiv.innerHTML = `
                <div class="message-avatar ai-avatar" aria-hidden>🤖</div>
                <div class="message-content">
                    <div class="typing-indicator">
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                    </div>
                </div>
            `;
            chatContainer.appendChild(typingDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function removeTypingIndicator() {
            const typingIndicator = document.getElementById('typing-indicator');
            if (typingIndicator) {
                typingIndicator.remove();
            }
        }

        // Handle transcription
        function handleTranscription(text) {
            // Final transcription handler
            if (text && text.trim()) {
                finalizeInterim(text);
                generateAIResponse(text);
            }
        }

        function showInterim(text) {
            if (!text) return;
            if (!interimBubble) {
                interimBubble = addMessage(text, true);
                interimBubble.classList.add('interim');
            } else {
                const node = interimBubble.querySelector('.message-text');
                if (node) node.innerHTML = escapeHtml(text) + ' <span style="opacity:0.6">⏳</span>';
            }
        }

        function finalizeInterim(text) {
            if (interimBubble) {
                const node = interimBubble.querySelector('.message-text');
                if (node) node.innerHTML = escapeHtml(text);
                interimBubble.classList.remove('interim');
                interimBubble = null;
            } else if (text) {
                addMessage(text, true);
            }
        }

        // Generate AI response (mock)
        function generateAIResponse(userMessage) {
            showTypingIndicator();
            
            setTimeout(() => {
                removeTypingIndicator();
                
                const responses = [
                    "I heard you say: \"" + userMessage + "\". I'm processing your voice input through real-time speech recognition.",
                    "Got it! Your voice has been transcribed successfully. How else can I assist you?",
                    "I've transcribed your speech. This is a demonstration of real-time voice AI capabilities.",
                    "Your message has been received and processed. The voice recognition is working perfectly!"
                ];
                
                const response = responses[Math.floor(Math.random() * responses.length)];
                addMessage(response, false);
            }, 1500);
        }

        // Start voice recording
        async function startVoiceRecording() {
            try {
                if (!webSocket || webSocket.readyState !== WebSocket.OPEN) {
                    await initWebSocket();
                }
                
                audioStream = await navigator.mediaDevices.getUserMedia({ 
                    audio: {
                        sampleRate: 16000,
                        channelCount: 1,
                        echoCancellation: true,
                        noiseSuppression: true
                    } 
                });
                
                mediaRecorder = new MediaRecorder(audioStream);
                
                mediaRecorder.ondataavailable = function(event) {
                    if (event.data.size > 0 && webSocket && webSocket.readyState === WebSocket.OPEN) {
                        const reader = new FileReader();
                        reader.onload = function() {
                            const arrayBuffer = reader.result;
                            const base64 = btoa(String.fromCharCode(...new Uint8Array(arrayBuffer)));
                            
                            webSocket.send(JSON.stringify({
                                event: "media",
                                media: { payload: base64 }
                            }));
                        };
                        reader.readAsArrayBuffer(event.data);
                    }
                };
                
                webSocket.send(JSON.stringify({
                    event: "start",
                    streamSid: "voice-ai-assistant"
                }));
                
                mediaRecorder.start(250);
                isRecording = true;
                
                voiceBtn.classList.add('recording');
                voiceBtn.textContent = '⏹️';
                voiceBtn.setAttribute('aria-pressed', 'true');
                voiceWave.classList.add('active');
                
            } catch (error) {
                console.error("Error:", error);
                alert("Error accessing microphone: " + error.message);
            }
        }

        // Stop voice recording
        function stopVoiceRecording() {
            if (mediaRecorder && isRecording) {
                mediaRecorder.stop();
                isRecording = false;
            }
            
            if (audioStream) {
                audioStream.getTracks().forEach(track => track.stop());
            }
            
            if (webSocket && webSocket.readyState === WebSocket.OPEN) {
                webSocket.send(JSON.stringify({
                    event: "stop"
                }));
            }
            
            voiceBtn.classList.remove('recording');
            voiceBtn.textContent = '🎤';
            voiceBtn.setAttribute('aria-pressed', 'false');
            voiceWave.classList.remove('active');
        }

        // Send text message
        function sendMessage() {
            const text = messageInput.value.trim();
            if (text) {
                addMessage(text, true);
                messageInput.value = '';
                generateAIResponse(text);
            }
        }

        // Use suggestion
        function useSuggestion(text) {
            messageInput.value = text;
            sendMessage();
        }

        // Event listeners
        voiceBtn.addEventListener('click', () => {
            if (!isRecording) {
                startVoiceRecording();
            } else {
                stopVoiceRecording();
            }
        });

        sendBtn.addEventListener('click', sendMessage);

        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        // Initialize (connect in background but tolerate failure)
        initWebSocket().catch(err => {
            console.warn("WebSocket connection failed:", err);
        });
    </script>
</body>
</html>
